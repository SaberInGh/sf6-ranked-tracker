<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柱状图 - 顶点连线</title>
<script src="chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    padding: 32px 36px 24px;
    width: 100%;
    max-width: 960px;
  }
  h2 {
    text-align: center;
    color: #1a1a2e;
    margin-bottom: 20px;
    font-size: 20px;
    font-weight: 600;
  }
  .chart-wrap {
    position: relative;
    width: 100%;
    height: 480px;
  }
</style>
</head>
<body>
<div class="card">
  <h2>数据柱状图（顶点连线）</h2>
  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>
</div>

<script>
const data = [13617,13558,13668,13660,13553,13680,13740,13851,13741,13711,13789,13889,13809,13780,13880,13858,13918,13890,13779,13829,13956];
const labels = data.map((_, i) => i + 1);

const ctx = document.getElementById('chart').getContext('2d');

new Chart(ctx, {
  type: 'bar',
  data: {
    labels,
    datasets: [
      {
        type: 'bar',
        label: '数值',
        data,
        backgroundColor: 'rgba(59, 130, 246, 0.65)',
        borderColor: 'rgba(59, 130, 246, 0.9)',
        borderWidth: 1,
        borderRadius: 3,
        barPercentage: 0.7,
        categoryPercentage: 0.85,
        order: 2,
      },
      {
        type: 'line',
        label: '趋势线',
        data,
        borderColor: '#ef4444',
        backgroundColor: 'rgba(239,68,68,0.08)',
        borderWidth: 2.5,
        pointBackgroundColor: '#ef4444',
        pointBorderColor: '#fff',
        pointBorderWidth: 1.5,
        pointRadius: 4,
        pointHoverRadius: 6,
        tension: 0,
        fill: false,
        order: 1,
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: {
        position: 'top',
        labels: { usePointStyle: true, padding: 20, font: { size: 13 } }
      },
      tooltip: {
        backgroundColor: 'rgba(0,0,0,0.78)',
        titleFont: { size: 13 },
        bodyFont: { size: 14 },
        padding: 10,
        callbacks: {
          label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()}`
        }
      }
    },
    scales: {
      x: {
        title: { display: true, text: '序号', font: { size: 13, weight: 'bold' } },
        grid: { display: false },
        ticks: { font: { size: 11 } }
      },
      y: {
        title: { display: true, text: '数值', font: { size: 13, weight: 'bold' } },
        min: 13400,
        max: 14050,
        ticks: {
          font: { size: 11 },
          callback: v => v.toLocaleString()
        },
        grid: { color: 'rgba(0,0,0,0.06)' }
      }
    }
  }
});
</script>
</body>
</html>
